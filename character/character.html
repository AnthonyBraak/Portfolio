<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="keywords"
      content="HTML, CSS, JavaScript, Portfolio, Developer, Character Creator"
    />
    <meta
      name="description"
      content="Simple Character Creator in Anthony's Portfolio"
    />
    <meta name="author" content="Anthony Braak" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="character.css" />
  </head>
  <body>
    <h1 class="tell">Create your character!</h1>
    <div class="create">
      <div class="intro">
        <div id="dropdown-container"></div>
        <input
          type="text"
          name="name"
          id="char-name"
          placeholder="What's your name?"
        />
        <input type="date" name="birth" id="char-birth" />
        <input type="color" name="color" id="char-color" />
        <button onclick="create()" class="btn-create">See what happens!</button>
      </div>
      <div class="character">
        <img src="./images/neutral.png" alt="Profile picture" id="char-img" />
        <p id="out-name">Name</p>
        <p id="out-age">Date</p>
      </div>
    </div>
    <script src="character.js"></script>
    <p>Back to <a href="../index.html">Main Page</a></p>
  </body>
</html>
